[workspace]
authors = ["Ashwin V. Mohanan"]
channels = ["conda-forge", "nodefaults"]
name = "xai-for-ls"
platforms = [
    "win-64",
    "linux-64",
    "osx-64",
    "osx-arm64",
    { platform = "win-64", cuda = "12.0" },
    { platform = "win-64", cuda = "13.0" },
    { platform = "linux-64", cuda = "12.0" },
    { platform = "linux-64", cuda = "13.0" },
]
version = "0.1.0"

[feature.gpu]
platforms = [
    "win-64-cuda-12-0",
    "win-64-cuda-13-0",
    "linux-64-cuda-12-0",
    "linux-64-cuda-13-0"
]  # the synthesized names for the entry above

[feature.gpu.dependencies]
# cuda-version = "13.*"
pytorch-gpu = ">=2.1"

[feature.cpu.dependencies]
pytorch-cpu = ">=2.1"

[environments]
default = ["cpu"]
gpu = ["gpu"]

[tasks]

[dependencies]
python = ">=3.10"
torchvision = ">=0.16"
scikit-learn = ">=1.3"
matplotlib-base = ">=3.7"
numpy = ">=1.24"
pandas = ">=2.0"
pillow = ">=10.0"
seaborn = ">=0.13"
captum = ">=0.7"
pyarrow = ">=14.0"
tqdm = ">=4.66"
jupyter = ">=1.0"
ipykernel = ">=6.29"
pip = "*"
git = ">=2.56.0,<3"
grad-cam = ">=1.5.7,<2"
shap = ">=0.50.0,<0.53"
imbalanced-learn = ">=0.14.2,<0.15"
certifi = ">=2026.10.19"
jupyter-ai = ">=3.2.0,<4"
jupyterlab-git = ">=0.55.0,<0.56"
jupyterlab-lsp = ">=5.3.0,<6"
python-lsp-server = ">=1.15.0,<2"

[pypi-dependencies]
opencv-python-headless = ">=4.8"
